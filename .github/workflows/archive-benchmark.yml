name: Archive benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Generated fixture content
        required: true
        default: mixed
        type: choice
        options:
          - mixed
          - compressible
          - random
      size_mib:
        description: Generated fixture size (MiB)
        required: true
        default: "256"
        type: choice
        options:
          - "64"
          - "256"
          - "1024"
      file_count:
        description: Generated fixture file count
        required: true
        default: "1000"
        type: choice
        options:
          - "128"
          - "1000"
          - "10000"
      runs:
        description: Timed ZIP/unzip repetitions
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      compression:
        description: ZIP compression level
        required: true
        default: "6"
        type: choice
        options:
          - "0"
          - "6"
          - "9"

permissions:
  contents: read

concurrency:
  group: archive-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Archive benchmark ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked backend dependencies
        run: bun ci
      - name: Type-check benchmark and production archive code
        run: bun run typecheck
      - name: Run production archive round-trip benchmark
        env:
          ARCHIVE_BENCH_DATASET: ${{ inputs.dataset }}
          ARCHIVE_BENCH_SIZE_MIB: ${{ inputs.size_mib }}
          ARCHIVE_BENCH_FILE_COUNT: ${{ inputs.file_count }}
          ARCHIVE_BENCH_RUNS: ${{ inputs.runs }}
          ARCHIVE_BENCH_COMPRESSION: ${{ inputs.compression }}
          ARCHIVE_BENCH_OUTPUT: benchmark-results/archive-${{ matrix.target }}.json
        run: bun run benchmark:archive
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-benchmark-${{ matrix.target }}
          path: server/benchmark-results/archive-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
