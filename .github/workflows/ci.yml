name: Continuous integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality and static build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked frontend dependencies
        run: bun ci
      - name: Verify frontend/backend Socket.IO compatibility
        working-directory: .
        run: >-
          bun -e 'const frontend = await Bun.file("client/package.json").json();
          const backend = await Bun.file("server/package.json").json();
          if (frontend.dependencies["socket.io-client"] !== backend.devDependencies["socket.io-client"])
          throw new Error("socket.io-client versions must match")'
      - name: Reject frontend runtime environment files and development URLs
        shell: bash
        run: |
          set -euo pipefail
          for file in .env .env.local .env.development .env.development.local .env.production .env.production.local; do
            if [[ -e "$file" ]]; then
              echo "::error::Frontend configuration must remain same-origin; remove client/$file."
              exit 1
            fi
          done
          if grep -R -E -n --exclude='*.map' \
            'https?://(localhost|127\.0\.0\.1)(:[0-9]+)?' src index.html public; then
            echo "::error::Frontend source contains a hard-coded development URL."
            exit 1
          fi
      - name: Lint frontend
        run: bun run lint
      - name: Build environment-neutral frontend
        shell: bash
        run: |
          set -euo pipefail
          vite_environment="$(env | sed -n '/^VITE_/p')"
          if [[ -n "$vite_environment" ]]; then
            echo "::error::Frontend builds must not receive VITE_* environment variables."
            exit 1
          fi
          env -u VITE_API_URL -u VITE_SOCKET_URL -u VITE_SOCKET_PATH bun run build
          test -f dist/index.html
          # Axios intentionally carries a bare http://localhost fallback for
          # non-browser URL parsing. Reject deployable development endpoints,
          # while the source check above catches application-owned bare URLs.
          if grep -R -E -n --exclude='*.map' \
            'https?://(localhost|127\.0\.0\.1):[0-9]+' dist; then
            echo "::error::Compiled frontend contains a hard-coded development URL."
            exit 1
          fi
      - name: Audit frontend dependencies
        run: bun audit
      - name: Report frontend licenses
        run: bun pm licenses
      - name: Upload verified static frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-frontend-static
          path: client/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend ${{ matrix.target }} native executable
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            binary: minecraft-server-panel-darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
            binary: minecraft-server-panel-linux-x64
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Download verified static frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-frontend-static
          path: client/dist
      - name: Verify static frontend input
        working-directory: .
        run: test -f client/dist/index.html
      - name: Install locked backend dependencies
        run: bun ci
      - name: Type-check backend
        run: bun run typecheck
      - name: Test backend
        run: bun test --parallel
      - name: Audit backend dependencies
        run: bun audit
      - name: Report backend licenses
        run: bun pm licenses
      - name: Reject native Node addons
        shell: bash
        run: |
          set -euo pipefail
          addon="$(find node_modules -type f -name '*.node' -print -quit)"
          if [[ -n "$addon" ]]; then
            echo "::error file=server/$addon::Native Node addons are not allowed in the standalone backend."
            exit 1
          fi
      - name: Validate release installer syntax
        run: bash -n release/install.sh
      - name: Build native executable
        env:
          PANEL_BUILD_TARGET: ${{ matrix.target }}
          PANEL_USE_EXISTING_FRONTEND_DIST: "true"
        run: bun run build
      - name: Verify executable checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c "${{ matrix.binary }}.sha256"
      - name: Smoke-test standalone executable
        run: bun run smoke:compiled
      - name: Install production-installer test dependency
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
      - name: Smoke-test production system installer
        if: matrix.target == 'linux-x64'
        run: bash tests/system-installer-smoke.sh dist/minecraft-server-panel-linux-x64
