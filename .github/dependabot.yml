version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(server)"
    groups:
      safe-version-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(client)"
    groups:
      safe-version-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Phoenix"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
